<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070914">
<title>Editor · KENDY MODS</title>
<style>
:root{--bg:#070914;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#eef1ff;--mut:#9aa3c7;--blue:#2f6bff;--purple:#9b4dff;--red:#ff3b5c;--green:#2dff9a;--cyan:#27e6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);min-height:100vh;
background:radial-gradient(800px 500px at 10% -10%,rgba(155,77,255,.35),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(39,230,255,.2),transparent 60%),var(--bg);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.5rem;text-align:center;margin:8px 0 16px}
h2{font-size:1.05rem;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;backdrop-filter:blur(12px)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);padding:10px 12px;font:inherit}
input:focus{outline:2px solid var(--cyan)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;padding:12px;font:700 1rem inherit;font-family:inherit;color:#fff;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.main{background:linear-gradient(90deg,var(--blue),var(--purple))}
.ok{background:linear-gradient(90deg,#14c26b,var(--cyan));color:#02140c}
.ghost{background:transparent;border:1px solid var(--line)}
.del{background:var(--red)}
.msg{min-height:1.3em;margin-top:10px;font-size:.9rem;text-align:center}
.msg.err{color:#ff7b92}.msg.good{color:var(--green)}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(0,0,0,.25)}
.item b{display:block;word-break:break-word}
.item small{display:block;color:var(--mut);word-break:break-all;margin-top:2px}
.row{display:flex;gap:8px}.row .btn{margin-top:10px;min-height:42px;font-size:.9rem}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top span{color:var(--mut);font-size:.85rem;word-break:break-all}
.top .btn{width:auto;margin:0;padding:8px 14px;min-height:38px}
</style>
</head>
<body>
<main>
  <h1>EDITOR · KENDY MODS</h1>

  <!-- Inicio de sesión -->
  <section class="card" id="loginBox">
    <h2>Acceso de administrador</h2>
    <form id="loginForm" autocomplete="on">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button class="btn main" id="btnLogin" type="submit">ENTRAR</button>
    </form>
    <div class="msg" id="loginMsg" aria-live="polite"></div>
  </section>

  <!-- Panel -->
  <section class="hide" id="panel">
    <div class="top"><span id="who"></span><button class="btn ghost" id="btnOut">Salir</button></div>

    <div class="card">
      <h2 id="formTitle">Agregar descarga</h2>
      <form id="appForm">
        <label for="name">Nombre del botón</label>
        <input id="name" maxlength="60" placeholder="Ej: Panel Free Fire v2" required>
        <label for="url">Enlace de descarga</label>
        <input id="url" type="url" placeholder="https://..." required>
        <button class="btn ok" id="btnSave" type="submit">GUARDAR</button>
        <button class="btn ghost hide" id="btnCancel" type="button">CANCELAR EDICIÓN</button>
      </form>
      <div class="msg" id="formMsg" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2>Descargas publicadas</h2>
      <p style="color:var(--mut);font-size:.85rem">Las más recientes aparecen arriba, igual que en la web.</p>
      <div id="list"></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// La configuración web de Firebase es pública por diseño; la seguridad la dan las REGLAS de Firestore.
const firebaseConfig = {
  apiKey: "AIzaSyA44bmeAGL6WthI39Bfn90jz4EFMChwbQs",
  authDomain: "base-hack-76727.firebaseapp.com",
  projectId: "base-hack-76727",
  storageBucket: "base-hack-76727.firebasestorage.app",
  messagingSenderId: "469682178915",
  appId: "1:469682178915:web:f217010277df1426dbe156"
};
const COLLECTION = "apps";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = s => document.querySelector(s);
let editingId = null, unsub = null;

function msg(el, text, type){ el.textContent = text; el.className = "msg " + (type||""); }
function errText(e){
  const c = e && e.code || "";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Correo o contraseña incorrectos.";
  if(/too-many-requests/.test(c)) return "Demasiados intentos. Espera unos minutos.";
  if(/permission-denied/.test(c)) return "Sin permiso: esta cuenta no es la del administrador.";
  if(/network/.test(c)) return "Sin conexión. Revisa tu internet.";
  return "Error: " + (c || e.message || e);
}

/* ---- Sesión ---- */
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = $("#btnLogin"); b.disabled = true; msg($("#loginMsg"), "Entrando…");
  try { await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#pass").value); msg($("#loginMsg"), ""); }
  catch(e){ msg($("#loginMsg"), errText(e), "err"); }
  b.disabled = false;
});
$("#btnOut").addEventListener("click", () => signOut(auth));
onAuthStateChanged(auth, user => {
  if(user){
    $("#loginBox").classList.add("hide"); $("#panel").classList.remove("hide");
    $("#who").textContent = user.email; startList();
  } else {
    $("#panel").classList.add("hide"); $("#loginBox").classList.remove("hide");
    if(unsub){ unsub(); unsub = null; } $("#pass").value = ""; resetForm();
  }
});

/* ---- Lista (más recientes arriba) ---- */
function startList(){
  if(unsub) unsub();
  const q = query(collection(db, COLLECTION), orderBy("createdAt", "desc"));
  unsub = onSnapshot(q, snap => {
    const box = $("#list"); box.innerHTML = "";
    if(snap.empty){ box.innerHTML = '<p style="color:var(--mut);margin-top:10px">Todavía no hay descargas.</p>'; return; }
    snap.forEach(d => {
      const v = d.data();
      const el = document.createElement("div"); el.className = "item";
      const n = document.createElement("b"); n.textContent = v.name;
      const u = document.createElement("small"); u.textContent = v.url;
      const row = document.createElement("div"); row.className = "row";
      const be = document.createElement("button"); be.className = "btn ghost"; be.textContent = "Editar";
      be.onclick = () => startEdit(d.id, v);
      const bd = document.createElement("button"); bd.className = "btn del"; bd.textContent = "Borrar";
      bd.onclick = async () => {
        if(!confirm("¿Borrar «" + v.name + "»?")) return;
        try { await deleteDoc(doc(db, COLLECTION, d.id)); if(editingId === d.id) resetForm(); }
        catch(e){ msg($("#formMsg"), errText(e), "err"); }
      };
      row.append(be, bd); el.append(n, u, row); box.appendChild(el);
    });
  }, e => msg($("#formMsg"), errText(e), "err"));
}

/* ---- Agregar / editar ---- */
function resetForm(){
  editingId = null; $("#appForm").reset();
  $("#formTitle").textContent = "Agregar descarga"; $("#btnSave").textContent = "GUARDAR";
  $("#btnCancel").classList.add("hide");
}
function startEdit(id, v){
  editingId = id; $("#name").value = v.name; $("#url").value = v.url;
  $("#formTitle").textContent = "Editar descarga"; $("#btnSave").textContent = "ACTUALIZAR";
  $("#btnCancel").classList.remove("hide"); window.scrollTo({top:0, behavior:"smooth"});
}
$("#btnCancel").addEventListener("click", () => { resetForm(); msg($("#formMsg"), ""); });
$("#appForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = $("#name").value.trim(), url = $("#url").value.trim();
  if(!name) return msg($("#formMsg"), "Escribe el nombre del botón.", "err");
  if(!/^https?:\/\//i.test(url)) return msg($("#formMsg"), "El enlace debe empezar por http:// o https://", "err");
  const b = $("#btnSave"); b.disabled = true; msg($("#formMsg"), "Guardando…");
  try {
    if(editingId) await updateDoc(doc(db, COLLECTION, editingId), { name, url });   // al editar conserva su posición
    else await addDoc(collection(db, COLLECTION), { name, url, createdAt: serverTimestamp() });
    msg($("#formMsg"), editingId ? "Actualizado." : "Publicado. Ya aparece arriba en la web.", "good");
    resetForm();
  } catch(e){ msg($("#formMsg"), errText(e), "err"); }
  b.disabled = false;
});
</script>
</body>
</html>
