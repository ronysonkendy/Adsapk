<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dravi DPI · Panel de keys</title>
<style>
:root{--bg:#000;--card:#0e0e12;--btn:#14141c;--stroke:#2a2a35;--text:#eaeaf0;--muted:#8a8a99;--accent:#00e5ff;--good:#39ff14;--bad:#ff3b5c;--warn:#ffd000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{height:3px;background:linear-gradient(90deg,#ff0040,#ffd000,#00ff6a,#00e5ff,#7a3cff,#ff0040);background-size:200% 100%;animation:rgb 4s linear infinite}
@keyframes rgb{to{background-position:-200% 0}}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.logo{font-size:24px;letter-spacing:.08em;margin:10px 0 4px;font-weight:800;background:linear-gradient(90deg,#ff0040,#ffd000,#00ff6a,#00e5ff,#7a3cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;font-size:12px;-webkit-text-fill-color:var(--muted);color:var(--muted);letter-spacing:.2em;font-weight:600}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:16px;margin-top:14px}
h2{margin:0 0 10px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label{display:block;margin:12px 0 4px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
input,select{width:100%;background:var(--btn);border:1px solid var(--stroke);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}
.btn{width:100%;margin-top:14px;background:var(--btn);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:14px;font-size:15px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--stroke);color:var(--muted)}
.btn.small{width:auto;margin:0;padding:8px 12px;font-size:12px}
.btn:disabled{opacity:.5}
.hidden{display:none!important}
.hint,.msg{font-size:12px;color:var(--muted);margin:10px 0 0}
.msg{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.result{margin-top:14px;border:1px dashed var(--good);border-radius:12px;padding:14px;text-align:center}
.result .big{font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--good);word-break:break-all;user-select:all}
.result .sub{font-size:12px;color:var(--muted);margin-top:6px}
.item{border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-top:10px}
.item .k{font-weight:800;letter-spacing:.05em;word-break:break-all}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.st{margin-top:6px;font-size:13px;font-weight:700}
.st.good{color:var(--good)}.st.bad{color:var(--bad)}.st.warn{color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:var(--card);border:1px solid var(--warn);border-radius:14px;padding:18px;max-width:440px;width:100%;font-size:14px;line-height:1.45}
.modal ul{padding-left:18px;margin:8px 0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#14141c;border:1px solid var(--good);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:20;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:var(--bad)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <h1 class="logo">DRAVI DPI <span>PANEL DE KEYS</span></h1>

  <section id="login" class="card hidden">
    <h2>Entrar</h2>
    <input id="email" type="email" placeholder="Correo del administrador" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" style="margin-top:10px">
    <button id="btnLogin" class="btn">ENTRAR</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <main id="panel" class="hidden">
    <div class="top"><span id="who"></span><button id="btnOut" class="btn small ghost">Salir</button></div>

    <section class="card">
      <h2>Generar key</h2>
      <label for="ffid">ID de Free Fire</label>
      <input id="ffid" inputmode="numeric" placeholder="Ej. 123456789">
      <label for="dur">Duración</label>
      <select id="dur">
        <option value="3600000">1 hora (prueba)</option>
        <option value="86400000" selected>24 horas</option>
        <option value="259200000">3 días</option>
        <option value="604800000">7 días</option>
        <option value="1296000000">15 días</option>
        <option value="2592000000">30 días</option>
        <option value="perm">Permanente</option>
        <option value="custom">Personalizada…</option>
      </select>
      <div id="customBox" class="row hidden" style="margin-top:10px">
        <input id="cn" type="number" min="1" placeholder="Cantidad">
        <select id="cu">
          <option value="60000">Minutos</option>
          <option value="3600000">Horas</option>
          <option value="86400000" selected>Días</option>
        </select>
      </div>
      <label for="note">Nota (opcional)</label>
      <input id="note" placeholder="Nombre del cliente, etc.">
      <button id="btnGen" class="btn good">GENERAR KEY</button>
      <p class="hint">La duración empieza a contar cuando la persona activa la key en la app. Cada key funciona en un solo teléfono.</p>
      <div id="result" class="result hidden">
        <div id="rKey" class="big"></div>
        <div id="rSub" class="sub"></div>
        <button id="rCopy" class="btn small" style="margin-top:10px">COPIAR KEY</button>
      </div>
    </section>

    <section class="card">
      <h2>Keys generadas <span id="count"></span></h2>
      <input id="search" placeholder="Buscar por ID, key o nota">
      <div id="list"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="box">
    <div id="modalText"></div>
    <div class="row">
      <button id="mNo" class="btn ghost">NO</button>
      <button id="mYes" class="btn good">SÍ</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, update, remove, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA44bmeAGL6WthI39Bfn90jz4EFMChwbQs",
  authDomain: "base-hack-76727.firebaseapp.com",
  databaseURL: "https://base-hack-76727-default-rtdb.firebaseio.com",
  projectId: "base-hack-76727",
  storageBucket: "base-hack-76727.firebasestorage.app",
  messagingSenderId: "469682178915",
  appId: "1:469682178915:web:f217010277df1426dbe156",
  measurementId: "G-SE1NQJR810"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getDatabase(fb);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let keys = {};
let stopListen = null;
let toastTimer;

function toast(m, bad) {
  const t = $('toast');
  t.textContent = m;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', 3500);
}

function fmt(ms) {
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d > 0) return d + ' d ' + h + ' h';
  if (h > 0) return h + ' h ' + mm + ' min';
  return Math.max(mm, 1) + ' min';
}

function durLabel(ms) {
  if (!ms) return 'Permanente';
  const d = 86400000, h = 3600000, m = 60000;
  if (ms % d === 0) return (ms / d) + (ms / d === 1 ? ' día' : ' días');
  if (ms % h === 0) return (ms / h) + (ms / h === 1 ? ' hora' : ' horas');
  return Math.round(ms / m) + ' min';
}

function status(v) {
  if (v.revoked) return { t: 'Revocada', c: 'bad' };
  if (!v.activatedAt) return { t: 'Sin activar', c: 'warn' };
  if (!v.durationMs) return { t: 'Permanente · activa', c: 'good' };
  const left = v.activatedAt + v.durationMs - Date.now();
  if (left <= 0) return { t: 'Expirada', c: 'bad' };
  return { t: 'Activa · vence en ' + fmt(left), c: 'good' };
}

const dateStr = ts => ts ? new Date(ts).toLocaleString('es') : '—';

function confirmBox(html) {
  return new Promise(res => {
    $('modalText').innerHTML = html;
    $('modal').classList.remove('hidden');
    const done = v => { $('modal').classList.add('hidden'); $('mYes').onclick = $('mNo').onclick = null; res(v); };
    $('mYes').onclick = () => done(true);
    $('mNo').onclick = () => done(false);
  });
}

async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast('Copiado'); }
  catch { prompt('Copia la key:', t); }
}

// ---------- Sesión ----------
onAuthStateChanged(auth, user => {
  if (stopListen) { stopListen(); stopListen = null; }
  if (!user) {
    $('login').classList.remove('hidden');
    $('panel').classList.add('hidden');
    keys = {};
    return;
  }
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  $('who').textContent = user.email;
  stopListen = onValue(ref(db, 'keys'),
    snap => { keys = snap.val() || {}; render(); },
    err => toast('No se pueden leer las keys. Revisa las reglas y tu UID (' + err.code + ')', true));
});

$('btnLogin').onclick = async () => {
  $('loginMsg').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
  catch (e) { $('loginMsg').textContent = 'No se pudo entrar: ' + (e.code || e.message); }
};
$('btnOut').onclick = () => signOut(auth);

// ---------- Generar ----------
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newKey() {
  for (;;) {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    let s = '';
    for (const x of b) s += ALPHA[x % 32];
    const k = 'DRAVI-' + s.match(/.{4}/g).join('-');
    if (!keys[k]) return k;
  }
}

$('dur').onchange = () => $('customBox').classList.toggle('hidden', $('dur').value !== 'custom');

function durationMs() {
  const sel = $('dur').value;
  if (sel === 'perm') return 0;
  if (sel === 'custom') {
    const n = Number($('cn').value), u = Number($('cu').value);
    return n > 0 ? Math.round(n * u) : null;
  }
  return Number(sel);
}

$('btnGen').onclick = async () => {
  const id = $('ffid').value.replace(/\D/g, '');
  if (id.length < 5) return toast('Escribe el ID de Free Fire (solo números)', true);
  const ms = durationMs();
  if (ms === null) return toast('Escribe una duración válida', true);

  const prev = Object.entries(keys).filter(([k, v]) => String(v.id) === id);
  if (prev.length) {
    const lines = prev
      .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0))
      .slice(0, 5)
      .map(([k, v]) => `<li><b>${esc(k)}</b> · ${esc(durLabel(v.durationMs))} · ${esc(status(v).t)}</li>`)
      .join('');
    const ok = await confirmBox(`<b>⚠ Este ID ya tiene ${prev.length} key(s) generada(s).</b><ul>${lines}</ul>¿Quieres generar otra de todas formas?`);
    if (!ok) return;
  }

  const key = newKey();
  $('btnGen').disabled = true;
  try {
    await set(ref(db, 'keys/' + key), {
      id, durationMs: ms, createdAt: serverTimestamp(), note: $('note').value.trim(), revoked: false
    });
    $('rKey').textContent = key;
    $('rSub').textContent = 'ID ' + id + ' · ' + durLabel(ms);
    $('rCopy').onclick = () => copy(key);
    $('result').classList.remove('hidden');
    $('note').value = '';
    copy(key);
  } catch (e) {
    toast('No se pudo guardar: ' + (e.code || e.message), true);
  }
  $('btnGen').disabled = false;
};

// ---------- Lista ----------
function render() {
  const q = $('search').value.trim().toLowerCase();
  const arr = Object.entries(keys)
    .map(([k, v]) => ({ k, ...v }))
    .filter(x => !q || x.k.toLowerCase().includes(q) || String(x.id).includes(q) || String(x.note || '').toLowerCase().includes(q))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $('count').textContent = '(' + arr.length + ')';
  $('list').innerHTML = arr.length ? arr.map(x => {
    const s = status(x);
    return `<div class="item">
      <div class="k">${esc(x.k)}</div>
      <div class="meta">ID <b>${esc(x.id)}</b> · ${esc(durLabel(x.durationMs))}${x.note ? ' · ' + esc(x.note) : ''}</div>
      <div class="meta">Creada: ${esc(dateStr(x.createdAt))}${x.activatedAt ? ' · Activada: ' + esc(dateStr(x.activatedAt)) : ''}</div>
      <div class="meta">Teléfono: ${x.device ? esc(String(x.device).slice(0, 6)) + '…' : 'sin asignar'}</div>
      <div class="st ${s.c}">${esc(s.t)}</div>
      <div class="acts">
        <button class="btn small" data-act="copy" data-k="${esc(x.k)}">Copiar</button>
        <button class="btn small ghost" data-act="revoke" data-k="${esc(x.k)}">${x.revoked ? 'Reactivar' : 'Revocar'}</button>
        <button class="btn small ghost" data-act="free" data-k="${esc(x.k)}">Liberar teléfono</button>
        <button class="btn small bad" data-act="del" data-k="${esc(x.k)}">Eliminar</button>
      </div>
    </div>`;
  }).join('') : '<p class="hint">Todavía no hay keys.</p>';
}

$('search').oninput = render;
setInterval(render, 30000);

$('list').onclick = async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const k = b.dataset.k, v = keys[k];
  if (!v) return;
  try {
    if (b.dataset.act === 'copy') return copy(k);
    if (b.dataset.act === 'revoke') {
      await update(ref(db, 'keys/' + k), { revoked: !v.revoked });
      toast(v.revoked ? 'Key reactivada' : 'Key revocada');
    }
    if (b.dataset.act === 'free') {
      if (await confirmBox('¿Liberar el teléfono de esta key? La próxima persona que la use quedará enlazada.')) {
        await remove(ref(db, `keys/${k}/device`));
        toast('Teléfono liberado');
      }
    }
    if (b.dataset.act === 'del') {
      if (await confirmBox('¿Eliminar esta key para siempre?')) {
        await remove(ref(db, 'keys/' + k));
        toast('Key eliminada');
      }
    }
  } catch (err) {
    toast('Error: ' + (err.code || err.message), true);
  }
};
</script>
</body>
</html>
